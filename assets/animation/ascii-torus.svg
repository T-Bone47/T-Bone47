<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
<title id="t">Animated ASCII torus</title><desc id="d">A looping amber monochrome ASCII torus rotating in a terminal-like display.</desc>
<rect width="900" height="360" rx="18" fill="#090B0E" stroke="#22D3EE" stroke-opacity=".55"/>
<text x="30" y="34" fill="#22D3EE" font-family="monospace" font-size="12">ASISH_OS // VISUAL COMPUTING EXPERIMENT</text>
<g transform="translate(450 188)" fill="#67E8F9" font-family="monospace" font-size="14" text-anchor="middle">
<text x="0" y="-90"> . - ~ ~ ~ - .</text>
<text x="0" y="-66"> /  @@@@@@@  \</text>
<text x="0" y="-42">| @@  :::  @@ |</text>
<text x="0" y="-18">| @  :::::  @ |</text>
<text x="0" y="6">| @@  :::  @@ |</text>
<text x="0" y="30"> \  @@@@@@@  /</text>
<text x="0" y="54"> ' - ~ ~ ~ - '</text>
<animateTransform attributeName="transform" type="rotate" values="0;8;0;-8;0" dur="5s" repeatCount="indefinite" additive="sum"/>
</g>
<text x="30" y="324" fill="#6B7280" font-family="monospace" font-size="11">ROTATION CYCLE / ASCII GEOMETRY / LOOP: ∞</text>
</svg>