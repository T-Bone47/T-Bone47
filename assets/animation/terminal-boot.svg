<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
<title id="t">ASISH OS terminal boot sequence</title><desc id="d">Terminal animation that types a system initialization sequence and ends at the ASISH OS prompt.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090B0E"/><stop offset="1" stop-color="#191D22"/></linearGradient><clipPath id="reveal"><rect x="30" y="78" width="1140" height="176"><animate attributeName="height" values="0;0;176;176" keyTimes="0;.08;.72;1" dur="7s" repeatCount="indefinite"/></rect></clipPath></defs>
<rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#bg)" stroke="#22D3EE" stroke-opacity=".55"/>
<path d="M1 52H1199" stroke="#22D3EE" stroke-opacity=".3"/>
<circle cx="28" cy="27" r="6" fill="#F87171"/><circle cx="50" cy="27" r="6" fill="#67E8F9"/><circle cx="72" cy="27" r="6" fill="#34D399"/>
<text x="100" y="32" fill="#9CA3AF" font-family="monospace" font-size="13">asish@engineering-os: ~</text>
<g clip-path="url(#reveal)" font-family="monospace" font-size="17">
<text x="32" y="96" fill="#67E8F9">$ boot --profile ASISH_OS</text>
<text x="32" y="128" fill="#D1D5DB">[ <tspan fill="#34D399">OK</tspan> ] Initializing engineering workspace</text>
<text x="32" y="160" fill="#D1D5DB">[ <tspan fill="#34D399">OK</tspan> ] Loading AI / ML modules</text>
<text x="32" y="192" fill="#D1D5DB">[ <tspan fill="#34D399">OK</tspan> ] Connecting telemetry pipelines</text>
<text x="32" y="224" fill="#D1D5DB">[ <tspan fill="#34D399">OK</tspan> ] Calibrating simulation systems</text>
<text x="32" y="256" fill="#67E8F9">$ ready_to_engineer <tspan fill="#67E8F9">▌<animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/></tspan></text>
</g>
<text x="1165" y="280" text-anchor="end" fill="#6B7280" font-family="monospace" font-size="10">AOS / TERMINAL 01</text>
</svg>