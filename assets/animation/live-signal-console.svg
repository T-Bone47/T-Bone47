<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">ASISH OS live signal console</title>
<desc id="d">A self-contained terminal-inspired ASCII signal display with looping telemetry waveforms, system labels and an animated cursor. The waveform is decorative, not live GitHub data.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07090C"/><stop offset="1" stop-color="#171B20"/></linearGradient>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#CBD5E1" stroke-opacity=".05"/></pattern>
 <clipPath id="screen"><rect x="28" y="64" width="1144" height="250" rx="8"/></clipPath>
</defs>
<rect x="1" y="1" width="1198" height="358" rx="16" fill="url(#bg)" stroke="#22D3EE" stroke-opacity=".65"/>
<rect x="2" y="2" width="1196" height="356" rx="15" fill="url(#grid)"/>
<path d="M1 48H1199" stroke="#22D3EE" stroke-opacity=".4"/>
<circle cx="26" cy="25" r="5" fill="#F87171"/><circle cx="46" cy="25" r="5" fill="#67E8F9"/><circle cx="66" cy="25" r="5" fill="#34D399"/>
<text x="92" y="30" fill="#D1D5DB" font-family="monospace" font-size="13">asish@engineering-os: ~/live-signal</text>
<text x="1168" y="30" text-anchor="end" fill="#34D399" font-family="monospace" font-size="11">● LOCAL DISPLAY</text>
<g clip-path="url(#screen)">
 <text x="42" y="92" fill="#67E8F9" font-family="monospace" font-size="12">╔══ SIGNAL MONITOR / ASCII TELEMETRY ═══════════════════════════════════════════════════════════════════════════╗</text>
 <text x="42" y="122" fill="#9CA3AF" font-family="monospace" font-size="12">CH-01 :: ENGINEERING ACTIVITY</text>
 <text x="42" y="151" fill="#67E8F9" font-family="monospace" font-size="15">▁▂▃▅▃▂▁▂▄▆▅▃▂▁▂▃▅▇▅▄▂▁▂▃▄▆▅▃▂▁▂▅▇▆▄▃▁</text>
 <text x="42" y="181" fill="#9CA3AF" font-family="monospace" font-size="12">CH-02 :: SYSTEM PIPELINE</text>
 <text x="42" y="210" fill="#34D399" font-family="monospace" font-size="15">.----.____.---.____.------.____.---.____.-----.____.</text>
 <text x="42" y="240" fill="#9CA3AF" font-family="monospace" font-size="12">CH-03 :: BUILD / MEASURE / ITERATE</text>
 <text x="42" y="269" fill="#67E8F9" font-family="monospace" font-size="15">01001000 01000001 01000011 01001011 00100000 01010100 01001000 01000101 00100000 01010000 01001100 01000001 01001110</text>
 <text x="42" y="299" fill="#D1D5DB" font-family="monospace" font-size="12">$ signal.status = "READY" <tspan fill="#67E8F9">▌<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
</g>
<text x="1167" y="338" text-anchor="end" fill="#6B7280" font-family="monospace" font-size="10">AOS / ASCII DISPLAY / DECORATIVE SIGNAL</text>
</svg>